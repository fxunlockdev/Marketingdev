pid /tmp/desvio-postiz-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/postiz-client-body;
    proxy_temp_path /tmp/postiz-proxy;
    fastcgi_temp_path /tmp/postiz-fastcgi;
    uwsgi_temp_path /tmp/postiz-uwsgi;
    scgi_temp_path /tmp/postiz-scgi;
    server {
        listen 5000;
        listen [::]:5000;
        server_name _;
        client_max_body_size 65m;
        add_header X-Content-Type-Options nosniff always;
        location = /health {
            proxy_pass http://127.0.0.1:5010/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location ~ "^/uploads/(?<media>[0-9]{4}/[0-9]{2}/[0-9]{2}/[a-f0-9]{32,64}\.(png|mp4))$" {
            alias /uploads/$media;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control no-store always;
        }
        location / { return 404; }
    }
}
